---
- name: Configure macOS system
  hosts: localhost
  connection: local
  gather_facts: yes
  become: no

  # The become password must be collected here, as a play variable, and not
  # via --ask-become-pass: the CLI flag feeds ansible's become machinery but
  # never defines the ansible_become_pass template variable, so every
  # "{{ ansible_become_pass }}" reference below (homebrew_cask sudo_password,
  # the fail-fast validation) silently resolved to undefined and pkg-based
  # casks failed mid-run with "sudo: a terminal is required to read the
  # password". vars_prompt defines the variable, which also feeds become for
  # privileged tasks. Without a TTY the prompt is skipped (the variable is
  # None, falsy everywhere it is used), and callers that must not prompt
  # pass -e ansible_become_pass= explicitly.
  vars_prompt:
    - name: ansible_become_pass
      prompt: "BECOME password"
      private: true

  # Every brew/cask task inherits this, so brew never upgrades casks that manage
  # their own updates (auto_updates true) — see https://github.com/Homebrew/brew/pull/21882.
  environment:
    HOMEBREW_NO_UPGRADE_AUTO_UPDATES_CASKS: "1"

  vars:
    dev_env_dir: /opt/sparkdock
    homebrew_prefix: "{{ (ansible_facts['machine'] == 'arm64') | ternary('/opt/homebrew', '/usr/local') }}"
    homebrew_install_path: "{{ homebrew_prefix }}/Homebrew"
    homebrew_brew_bin_path: "{{ homebrew_prefix }}/bin"

  tasks:
    - name: Check if running in non-interactive environment
      tags: always
      set_fact:
        is_non_interactive: "{{ ansible_facts['env'].CI is defined or ansible_facts['env'].GITHUB_ACTIONS is defined or ansible_facts['env'].RUNNER_OS is defined or ansible_facts['env'].CIRRUS_CI is defined or ansible_facts['env'].HOME == '/var/root' }}"

    # Pkg-based casks (docker-desktop, zoom, ...) run sudo during install.
    # Homebrew wires that sudo to an askpass helper (SUDO_ASKPASS + -A) that
    # the homebrew_cask module builds from ansible_become_pass via its
    # sudo_password option — but only when the collected password is
    # non-empty. An empty or wrong password at the "BECOME password:" prompt
    # therefore surfaces much later as a cryptic "sudo: a terminal is
    # required to read the password" failure inside the cask install.
    # Validate the password up front and fail fast with a clear message.
    # Runs only when cask work is on the menu (full runs or explicit cask
    # tags); tag-only runs that suppress the prompt (e.g. --tags tui with
    # -e ansible_become_pass=) are left alone.
    - name: Validate become password (fail fast for cask installers)
      tags: always
      when:
        - not is_non_interactive
        - ('all' in ansible_run_tags) or ('cask' in ansible_run_tags)
      block:
        - name: Check the become password against sudo
          ansible.builtin.command: sudo -S -k -v
          args:
            stdin: "{{ ansible_become_pass }}"
          changed_when: false
          become: false
          no_log: true
      rescue:
        - name: Explain the become password failure
          ansible.builtin.fail:
            msg: >-
              The password entered at the "BECOME password:" prompt was empty
              or incorrect. Package installation needs it for privileged
              install steps (pkg-based casks such as docker-desktop or zoom),
              which otherwise fail late with "sudo: a terminal is required to
              read the password". Re-run sparkdock and enter your macOS user
              password at the prompt.

    # Self-heal a root-owned ~/.local (seen on machines set up via Migration
    # Assistant or after an old sudo-run tool created it): every become: false
    # task writing under it (zsh site-functions, macos-defaults overrides,
    # http-proxy certs) fails with EACCES otherwise. Same pattern as the
    # http-proxy directory ownership fix below.
    - name: Check ownership of ~/.local
      tags: always
      stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.local"
      register: user_local_dir

    - name: Fix root-owned ~/.local
      tags: always
      file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local"
        state: directory
        owner: "{{ ansible_facts['user_id'] }}"
        group: staff
        recurse: yes
      become: yes
      become_method: sudo
      when:
        - not is_non_interactive
        - "'all' in ansible_run_tags"
        - user_local_dir.stat.exists
        - user_local_dir.stat.pw_name == 'root'

    - name: Load all packages
      include_vars:
        file: "{{ dev_env_dir }}/config/packages/all-packages.yml"
        name: all_packages
      tags: always

    - name: Collect all package lists
      tags:
        - brew_packages
        - npm_packages
        - always
      set_fact:
        all_cask_packages: "{{ all_packages.cask_packages | default([]) }}"
        all_cask_install_once: "{{ all_packages.cask_install_once_packages | default([]) }}"
        all_cask_latest_packages: "{{ all_packages.cask_latest_packages | default([]) }}"
        all_homebrew_packages: "{{ all_packages.homebrew_packages | default([]) }}"
        all_linked_packages: "{{ all_packages.linked_packages | default([]) }}"
        all_removed_homebrew: "{{ all_packages.removed_homebrew_packages | default([]) }}"
        all_removed_taps: "{{ all_packages.removed_taps | default([]) }}"
        all_taps: "{{ all_packages.taps | default([]) }}"
        all_removed_cask_packages: "{{ all_packages.removed_cask_packages | default([]) }}"
        all_removed_npm_packages: "{{ all_packages.removed_npm_packages | default([]) }}"
        all_npm_packages: "{{ all_packages.npm_packages | default([]) }}"

    - name: Configure homebrew taps
      tags: brew_packages
      community.general.homebrew_tap:
        name: "{{ item }}"
        state: present
      loop: "{{ all_taps }}"
      when: all_taps | length > 0
      become: false

    - name: Trust third-party homebrew taps (Homebrew >= 6, HOMEBREW_REQUIRE_TAP_TRUST)
      tags: brew_packages
      ansible.builtin.shell: |
        set -uo pipefail
        if ! brew commands | tr ' ' '\n' | grep -qx trust; then
          echo "skip: brew trust unavailable"
          exit 0
        fi
        brew trust --tap "{{ item }}"
      args:
        executable: /bin/bash
      loop: "{{ all_taps }}"
      become: false
      register: brew_trust
      changed_when: "'Trusted tap' in brew_trust.stdout"
      when: all_taps | length > 0

    - name: Debug loaded variables
      debug:
        msg:
          - "All removed homebrew: {{ all_removed_homebrew }}"
          - "All removed taps: {{ all_removed_taps }}"
          - "All cask packages: {{ all_cask_packages }}"
          - "All homebrew packages: {{ all_homebrew_packages }}"
          - "All linked packages: {{ all_linked_packages }}"
          - "All npm packages: {{ all_npm_packages }}"
          - "All variables: {{ lookup('varnames', '.+', wantlist=True) }}"
      when: ansible_verbosity >= 1

    - name: Debug homebrew paths
      debug:
        msg:
          - "Prefix: {{ homebrew_prefix }}"
          - "Install path: {{ homebrew_install_path }}"
          - "Bin path: {{ homebrew_brew_bin_path }}"

    - name: Check which deprecated taps are actually installed
      tags: brew_packages
      ansible.builtin.command:
        argv:
          - brew
          - tap
      register: installed_taps
      when: all_removed_taps | length > 0
      become: false
      changed_when: false

    - name: Remove deprecated taps before homebrew update
      tags: brew_packages
      ansible.builtin.command:
        argv:
          - brew
          - untap
          - --force
          - "{{ item }}"
      loop: "{{ all_removed_taps }}"
      when:
        - all_removed_taps | length > 0
        - item in installed_taps.stdout
      become: false
      ignore_errors: true

    - name: Update homebrew
      tags: brew_packages
      community.general.homebrew:
        update_homebrew: true
        upgrade_all: false
      become: false

    - name: Remove unwanted packages
      tags: brew_packages
      community.general.homebrew:
        name: "{{ item }}"
        state: absent
        update_homebrew: false
      loop: "{{ all_removed_homebrew }}"
      when: all_removed_homebrew | length > 0
      become: false

    - name: Install-once casks (install if absent, never force-reinstall)
      tags: [cask]
      block:
        - name: Detect already-installed install-once casks
          shell: |
            if brew list --cask "{{ item.name }}" >/dev/null 2>&1; then
              echo yes
            elif [ -n "{{ item.app | default('') }}" ] && { [ -d "/Applications/{{ item.app | default('') }}.app" ] || [ -d "{{ ansible_facts['env']['HOME'] }}/Applications/{{ item.app | default('') }}.app" ]; }; then
              echo yes
            else
              echo no
            fi
          loop: "{{ all_cask_install_once }}"
          register: install_once_checks
          changed_when: false
          become: false

        - name: Build list of missing install-once casks
          set_fact:
            cask_install_once_to_install: "{{ install_once_checks.results | selectattr('stdout', 'equalto', 'no') | map(attribute='item.name') | list }}"

        - name: Install missing install-once casks
          community.general.homebrew_cask:
            name: "{{ item }}"
            state: present
            sudo_password: "{{ ansible_become_pass | default(omit) }}"
          loop: "{{ cask_install_once_to_install }}"
          when: cask_install_once_to_install | length > 0
          become: false

    - name: Transition GitHub Copilot CLI from npm to brew cask
      tags: copilot-cli
      block:
        - name: Check if copilot-cli cask is already installed
          shell: brew list --cask copilot-cli >/dev/null 2>&1 && echo yes || echo no
          register: copilot_cli_installed
          changed_when: false
          become: false

        - name: Check if npm command is available
          shell: command -v npm >/dev/null 2>&1 && echo "available" || echo "not-available"
          register: npm_available
          changed_when: false
          become: false

        - name: Check if npm @github/copilot is installed globally
          shell: npm list -g @github/copilot 2>/dev/null || echo "not-installed"
          register: npm_copilot_check
          changed_when: false
          when: npm_available.stdout == "available"
          become: false

        - name: Uninstall npm @github/copilot package
          community.general.npm:
            name: "@github/copilot"
            global: true
            state: absent
          when:
            - npm_available.stdout == "available"
            - npm_copilot_check.stdout is defined
            - "'not-installed' not in npm_copilot_check.stdout"
          become: false

        - name: Check if copilot binary exists
          stat:
            path: "{{ homebrew_prefix }}/bin/copilot"
          register: copilot_binary
          become: false

        - name: Remove copilot binary if it exists (cleanup for transition)
          file:
            path: "{{ homebrew_prefix }}/bin/copilot"
            state: absent
          when:
            - copilot_binary.stat.exists
            - copilot_cli_installed.stdout == "no"
          become: false
          ignore_errors: true

    # Migration: uninstall claude-code (stable) before installing claude-code@latest
    - name: Remove claude-code stable cask (replaced by claude-code@latest)
      tags: cask
      community.general.homebrew_cask:
        name: claude-code
        state: absent
      become: false
      ignore_errors: true

    - name: Install cask packages
      tags: cask
      community.general.homebrew_cask:
        name: "{{ item }}"
        state: present
        install_options: force
        sudo_password: "{{ ansible_become_pass | default(omit) }}"
      loop: "{{ all_cask_packages }}"
      when: all_cask_packages | length > 0
      become: false

    - name: Upgrade cask packages to latest
      tags: cask
      community.general.homebrew_cask:
        name: "{{ item }}"
        state: upgraded
        sudo_password: "{{ ansible_become_pass | default(omit) }}"
      loop: "{{ all_cask_latest_packages }}"
      when: all_cask_latest_packages | length > 0
      become: false

    - name: Assert cask packages installed
      shell: |
        missing=0
        for pkg in {{ (all_cask_packages + all_cask_latest_packages) | map('quote') | join(' ') }}; do
          brew list --cask "$pkg" >/dev/null 2>&1 || { echo "$pkg missing"; missing=1; }
        done
        exit $missing
      register: cask_check
      changed_when: false
      failed_when: cask_check.rc != 0
      become: false

    - name: Install gke-gcloud-auth-plugin component
      shell: source {{ homebrew_prefix }}/share/google-cloud-sdk/path.zsh.inc && gcloud components install gke-gcloud-auth-plugin --quiet
      args:
        executable: /bin/zsh
      when: "'google-cloud-sdk' in all_cask_latest_packages"
      become: false

    - name: Disable gcloud survey prompts
      shell: source {{ homebrew_prefix }}/share/google-cloud-sdk/path.zsh.inc && gcloud config set survey/disable_prompts true
      args:
        executable: /bin/zsh
      when: "'google-cloud-sdk' in all_cask_latest_packages"
      become: false

    - name: Disable gcloud usage reporting
      shell: source {{ homebrew_prefix }}/share/google-cloud-sdk/path.zsh.inc && gcloud config set core/disable_usage_reporting true
      args:
        executable: /bin/zsh
      when: "'google-cloud-sdk' in all_cask_latest_packages"
      become: false

    - name: Check if npm command is available
      shell: command -v npm >/dev/null 2>&1 && echo "available" || echo "not-available"
      register: npm_available
      changed_when: false
      become: false
      tags:
        - brew_packages
        - npm_packages

    - name: Uninstall removed npm packages
      tags: brew_packages
      community.general.npm:
        name: "{{ item }}"
        global: true
        state: absent
      loop: "{{ all_removed_npm_packages }}"
      become: false
      when:
        - npm_available.stdout == "available"
        - all_removed_npm_packages | length > 0

    - name: Fix ownership of Homebrew Python files (prevents "apply2files Permission denied" on brew install)
      tags: brew_packages
      ansible.builtin.shell: |
        set -uo pipefail
        owner="{{ ansible_facts['user_id'] }}"
        fixed=0
        for base in "{{ homebrew_prefix }}/lib" "{{ homebrew_prefix }}/Cellar"; do
          [ -d "${base}" ] || continue
          for dir in "${base}"/python*; do
            [ -d "${dir}" ] || continue
            count=$(find "${dir}" ! -user "${owner}" -print -exec chown "${owner}" {} + 2>/dev/null | wc -l | tr -d ' ')
            fixed=$((fixed + count))
          done
        done
        echo "fixed=${fixed}"
      args:
        executable: /bin/bash
      register: brew_python_perms
      changed_when: "'fixed=0' not in brew_python_perms.stdout"
      when: not is_non_interactive

    - name: Install homebrew packages
      tags: brew_packages
      community.general.homebrew:
        name: "{{ item }}"
        state: latest
        update_homebrew: false
      loop: "{{ all_homebrew_packages }}"
      when: all_homebrew_packages | length > 0
      become: false

    - name: Re-bind tap-qualified packages whose install receipt points at a renamed tap
      tags: brew_packages
      ansible.builtin.shell: |
        set -euo pipefail
        # A package installed before its tap was renamed keeps the old tap in its install
        # receipt; `state: latest` is a no-op on the bare name and never rebinds it, so the
        # tap-qualified assert below fails. If the bare formula is installed but the
        # tap-qualified name is not, reinstall to rebind the receipt to the declared tap.
        name="{{ item.split('/') | last }}"
        if brew list "${name}" >/dev/null 2>&1 && ! brew list "{{ item }}" >/dev/null 2>&1; then
          brew reinstall "{{ item }}"
          echo "rebound"
        fi
      args:
        executable: /bin/bash
      loop: "{{ all_homebrew_packages | select('search', '/') | list }}"
      become: false
      register: tap_rebind
      changed_when: "'rebound' in tap_rebind.stdout"
      when: all_homebrew_packages | length > 0

    - name: Assert homebrew packages installed
      tags: brew_packages
      shell: |
        missing=0
        for pkg in {{ all_homebrew_packages | map('quote') | join(' ') }}; do
          brew list "$pkg" >/dev/null 2>&1 || { echo "$pkg missing"; missing=1; }
        done
        exit $missing
      register: brew_check
      changed_when: false
      failed_when: brew_check.rc != 0
      become: false

    - name: Install npm global packages
      tags: npm_packages
      community.general.npm:
        name: "{{ item }}"
        global: true
        state: latest
      loop: "{{ all_npm_packages }}"
      when:
        - npm_available.stdout == "available"
        - all_npm_packages | length > 0
      become: false

    - name: Assert npm packages installed
      tags: npm_packages
      shell: |
        missing=0
        for pkg in {{ all_npm_packages | map('quote') | join(' ') }}; do
          npm list -g "$pkg" >/dev/null 2>&1 || { echo "$pkg missing"; missing=1; }
        done
        exit $missing
      register: npm_check
      changed_when: false
      failed_when: npm_check.rc != 0
      when:
        - npm_available.stdout == "available"
        - all_npm_packages | length > 0
      become: false

    - name: Ensure zsh site-functions directory exists
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/share/zsh/site-functions"
        state: directory
        mode: "0755"
      become: false
      tags: npm_packages

    - name: Link yarn with conflict resolution
      command: brew link --overwrite yarn
      when: "'yarn' in all_homebrew_packages"
      become: false
      ignore_errors: yes

    - name: Link openspec with conflict resolution
      command: brew link --overwrite openspec
      when: "'openspec' in all_homebrew_packages"
      become: false
      ignore_errors: yes

    - name: Link required packages
      community.general.homebrew:
        name: "{{ item }}"
        state: linked
      loop: "{{ all_linked_packages }}"
      when: all_linked_packages | length > 0
      become: false

    - name: Run brew doctor
      command: brew doctor
      register: brew_doctor_result
      changed_when: false
      ignore_errors: yes
      become: false

    - name: Show brew doctor results
      debug:
        msg: "{{ brew_doctor_result.stdout_lines }}"
      when: brew_doctor_result.stdout != ""

    - name: Show brew doctor warnings
      debug:
        msg: "{{ brew_doctor_result.stderr_lines }}"
      when: brew_doctor_result.stderr != ""

    - name: Configure DNS resolver
      block:
        - name: Create resolver directory
          file: path=/etc/resolver state=directory mode=0755

        - name: Create and configure loc resolver
          copy:
            dest: /etc/resolver/loc
            content: |
              nameserver 127.0.0.1
              port 19322
            mode: 0755

        - name: Clear dns cache
          command: killall -HUP mDNSResponder
      become: yes
      become_method: sudo

    - name: Configure git safe directory for sparkdock
      tags: [always]
      become: no
      block:
        - name: Check if sparkdock is already in git safe.directory
          shell: git config --global --get-all safe.directory | grep -Fx "{{ dev_env_dir }}" || true
          register: sparkdock_safe_dir_check
          changed_when: false

        - name: Add sparkdock to git safe.directory
          command: git config --global --add safe.directory "{{ dev_env_dir }}"
          when: sparkdock_safe_dir_check.stdout == ""

    - name: Install system scripts
      tags: http-proxy
      block:
        - name: Check if http-proxy is already in git safe.directory
          shell: git config --global --get-all safe.directory | grep -Fx "{{ dev_env_dir }}/http-proxy" || true
          register: http_proxy_safe_dir_check
          changed_when: false
          become: no

        - name: Add http-proxy to git safe.directory
          command: git config --global --add safe.directory "{{ dev_env_dir }}/http-proxy"
          become: no
          when: http_proxy_safe_dir_check.stdout == ""

        - name: Ensure /usr/local/bin exists
          file: path=/usr/local/bin state=directory

        - name: Check if http-proxy directory exists
          stat:
            path: "{{ dev_env_dir }}/http-proxy"
          register: http_proxy_dir

        - name: Fix ownership of http-proxy directory for git operations.
          file:
            path: "{{ dev_env_dir }}/http-proxy"
            owner: "{{ ansible_facts['user_id'] }}"
            group: "{{ ansible_facts['user_gid'] }}"
            recurse: yes
          when: not (is_non_interactive | default(false))
          become: yes
          become_method: sudo

        - name: Clone http-proxy repository
          git:
            repo: https://github.com/sparkfabrik/http-proxy.git
            dest: "{{ dev_env_dir }}/http-proxy"
            version: main
            force: yes
            update: yes
          register: http_proxy_clone
          become: no

        - name: Make spark-http-proxy executable
          file:
            path: "{{ dev_env_dir }}/http-proxy/bin/spark-http-proxy"
            mode: "0755"

        - name: Create main spark-http-proxy symlink
          file:
            src: "{{ dev_env_dir }}/http-proxy/bin/spark-http-proxy"
            dest: /usr/local/bin/spark-http-proxy
            state: link
            force: yes

        - name: Copy remaining system scripts
          copy:
            src: "{{ item.src }}"
            dest: "{{ item.dest }}"
            mode: "0755"
          loop:
            - {
                src: "{{ dev_env_dir }}/config/bin/test-http-proxy",
                dest: "/usr/local/bin/test-http-proxy",
              }
            - {
                src: "{{ dev_env_dir }}/config/macos/bin/ayse-get-sm",
                dest: "/usr/local/bin/ayse-get-sm",
              }
            - {
                src: "{{ dev_env_dir }}/config/bin/sparkfabrik-claude-code-otel-headers",
                dest: "/usr/local/bin/sparkfabrik-claude-code-otel-headers",
              }
      become: yes
      become_method: sudo

    - name: Restart http-proxy service
      tags: http-proxy
      block:
        - name: Check if Docker daemon is running
          command: docker info
          register: docker_check
          changed_when: false
          failed_when: false

        - name: Start http-proxy service
          command: spark-http-proxy start
          register: http_proxy_start
          changed_when: true
          when: docker_check.rc == 0

        - name: Display http-proxy service status
          debug:
            msg: "✅ Http-proxy service restarted successfully"
          when: docker_check.rc == 0

        - name: Docker not available notice
          debug:
            msg: "⚠️  Docker not available, skipping http-proxy service restart"
          when: docker_check.rc != 0
      become: no

    - name: Configure keyboard settings
      tags: keyboard
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
      loop:
        - {
            src: "config/keyboard/en-intl-alt-gr-dead-keys.keylayout",
            dest: "~/Library/Keyboard Layouts",
          }
        - {
            src: "config/keyboard/DefaultKeyBinding.dict",
            dest: "~/Library/KeyBindings",
          }

    # Install to /usr/local/bin as the other binaries.
    - name: Install sjust executable
      tags: sjust
      block:
        - name: Copy sjust executable
          copy:
            src: "{{ dev_env_dir }}/sjust/sjust.sh"
            dest: "/usr/local/bin/sjust"
            mode: "0755"
          become: yes
          become_method: sudo

        - name: Get Homebrew prefix
          command: brew --prefix
          register: brew_prefix
          changed_when: false

        - name: Ensure zsh site-functions directory exists with correct ownership
          file:
            path: "{{ brew_prefix.stdout }}/share/zsh/site-functions"
            state: directory
            owner: "{{ ansible_facts['user_id'] }}"
            group: "{{ ansible_facts['user_gid'] }}"
            mode: "0755"
          become: yes
          become_method: sudo

        - name: Check for existing _sjust completion file
          stat:
            path: "{{ brew_prefix.stdout }}/share/zsh/site-functions/_sjust"
          register: sjust_completion

        - name: Ensure _sjust completion file has correct ownership (if present)
          file:
            path: "{{ brew_prefix.stdout }}/share/zsh/site-functions/_sjust"
            owner: "{{ ansible_facts['user_id'] }}"
            group: "{{ ansible_facts['user_gid'] }}"
            mode: "0644"
          become: yes
          become_method: sudo
          when: sjust_completion.stat.exists

        - name: Install sjust zsh completion
          copy:
            src: "{{ dev_env_dir }}/sjust/completions/_sjust"
            dest: "{{ brew_prefix.stdout }}/share/zsh/site-functions/_sjust"
            mode: "0644"
          become: no

        - name: Ensure sjust zsh completion has correct ownership and permissions
          file:
            path: "{{ brew_prefix.stdout }}/share/zsh/site-functions/_sjust"
            owner: "{{ ansible_facts['user_id'] }}"
            group: "{{ ansible_facts['user_gid'] }}"
            mode: "0644"
          become: yes
          become_method: sudo

    - name: Apply curated macOS defaults
      ansible.builtin.command: "{{ dev_env_dir }}/sjust/sjust.sh macos-defaults"
      register: macos_defaults_result
      changed_when: "'MACOS_DEFAULTS_STATUS: applied' in macos_defaults_result.stdout"
      become: false
      tags: macos-defaults

    - name: Remove unwanted cask packages
      community.general.homebrew_cask:
        name: "{{ item }}"
        state: absent
      loop: "{{ all_removed_cask_packages }}"
      when: all_removed_cask_packages | length > 0
      become: false

    - name: Install Sparkdock Menu Bar App
      tags: menubar
      block:
        - name: Install Claude usage provider without standalone reader
          ansible.builtin.command:
            argv:
              - /usr/bin/env
              - bash
              - "{{ dev_env_dir }}/sjust/scripts/claude-usage.sh"
              - install
              - v0.6.0
            creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/claude-usage"
          environment:
            CLAUDE_USAGE_READER: "0"
          register: claude_usage_install
          changed_when: "'CHANGED:' in claude_usage_install.stdout"
          become: false

        - name: Build menu bar app
          shell: |
            cd {{ dev_env_dir }}/src/menubar-app
            swift build -c release
          register: build_result
          changed_when: build_result.rc == 0
          failed_when: false # Don't fail immediately, handle errors in rescue block

        - name: Check if build was successful
          fail:
            msg: "Swift build failed. See rescue block for instructions."
          when: build_result.rc != 0

        - name: Install menu bar app binary
          copy:
            src: "{{ dev_env_dir }}/src/menubar-app/.build/release/sparkdock-manager"
            dest: "{{ homebrew_brew_bin_path }}/sparkdock-manager"
            mode: "0755"
            remote_src: true

        - name: Clear provenance xattr and warm code signature
          # A freshly written binary fires an ES_EVENT_TYPE_AUTH_EXEC event on its
          # first exec; under load an Endpoint Security agent (e.g. Mosyle) can be
          # slow to authorize, the kernel denies the exec and the verify task below
          # dies with rc -9 (SIGKILL). Removing the provenance xattr and re-applying
          # the ad-hoc signature warms the assessment synchronously. See issue #537.
          # The xattr removal is best-effort (the attribute may be absent), but the
          # codesign step must succeed, so they are separate commands rather than a
          # ';'-joined pipeline whose exit status would only reflect codesign.
          ansible.builtin.shell: |
            xattr -d com.apple.provenance "{{ homebrew_brew_bin_path }}/sparkdock-manager" 2>/dev/null || true
            codesign --force --sign - "{{ homebrew_brew_bin_path }}/sparkdock-manager"
          changed_when: false

        - name: Verify menu bar app works
          command: "{{ homebrew_brew_bin_path }}/sparkdock-manager --status"
          register: sparkdock_status
          changed_when: false
          # Absorb a transient first-exec denial from an Endpoint Security agent
          # until its verdict caches. See issue #537.
          retries: 5
          delay: 2
          until: sparkdock_status.rc == 0

        - name: Display menu bar app status
          debug:
            msg: "{{ sparkdock_status.stdout_lines }}"

        - name: LaunchAgent installation (local environment only)
          block:
            - name: Remove old update service (replace with menubar app)
              file:
                path: "{{ item }}"
                state: absent
              loop:
                - "~/Library/LaunchAgents/com.sparkfabrik.sparkdock.plist"
              ignore_errors: yes

            - name: Ensure user LaunchAgents directory exists
              file:
                path: "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents"
                state: directory
                mode: "0755"
              become: no

            - name: Install menubar app launch agent
              copy:
                src: "{{ dev_env_dir }}/src/menubar-app/com.sparkfabrik.sparkdock.menubar.plist"
                dest: "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/com.sparkfabrik.sparkdock.menubar.plist"
                mode: "0644"
              become: no

            - name: Load menubar app launch agent
              shell: |
                pkill -f "sparkdock-manager" 2>/dev/null || true
                launchctl bootout gui/$(id -u) "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/com.sparkfabrik.sparkdock.menubar.plist" 2>/dev/null || true
                launchctl bootstrap gui/$(id -u) "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/com.sparkfabrik.sparkdock.menubar.plist"
                launchctl enable gui/$(id -u)/com.sparkfabrik.sparkdock.menubar
                launchctl kickstart gui/$(id -u)/com.sparkfabrik.sparkdock.menubar
              become: no
              ignore_errors: yes
          when: not is_non_interactive

      rescue:
        - name: Report which task actually failed
          debug:
            msg:
              - "❌ Sparkdock Menu Bar App installation failed!"
              - "Failed task: {{ ansible_failed_task.name | default('unknown') }}"
              - "Error: {{ ansible_failed_result.msg | default(ansible_failed_result) | default('see output above') }}"

        - name: Show build error output
          debug:
            msg:
              - "Build command output:"
              - "{{ build_result.stdout_lines | default(['No stdout']) }}"
              - "Build command stderr:"
              - "{{ build_result.stderr_lines | default(['No stderr']) }}"
          when: build_result is defined

        - name: Show Xcode command line tools hint (compilation failures only)
          debug:
            msg:
              - "This looks like a Swift compilation problem (build returned rc={{ build_result.rc }})."
              - "Common causes: broken Xcode command line tools, missing headers."
              - ""
              - "🔧 To fix, run:"
              - "   sjust sparkdock-menubar-reinstall"
              - ""
              - "This will remove and reinstall the Xcode command line tools, then retry the install."
          when: build_result is defined and build_result.rc != 0

        - name: Fail with context-aware message
          fail:
            msg: >-
              {% if build_result is defined and build_result.rc != 0 %}Menubar app compilation failed. Run 'sjust sparkdock-menubar-reinstall' to fix Xcode command line tools and retry installation.{% else %}Menubar app install failed at task '{{ ansible_failed_task.name | default('unknown') }}': {{ ansible_failed_result.msg | default('see output above') }}{% endif %}

    - name: Install Sparkdock TUI
      tags: tui
      become: false
      block:
        - name: Build sparkdock TUI
          shell: |
            cd {{ dev_env_dir }}/src/tui
            mkdir -p .build
            go build -o .build/sparkdock-tui ./cmd/sparkdock-tui
          environment:
            PATH: "{{ homebrew_brew_bin_path }}:{{ ansible_facts['env'].PATH }}"
          register: tui_build_result
          # go's build cache makes the build a no-op when sources are unchanged,
          # so the compile itself is never a "change"; the install copy below
          # reports whether the binary actually changed.
          changed_when: false
          failed_when: false

        - name: Check if TUI build was successful
          fail:
            msg: |-
              go build failed for src/tui:
              {{ tui_build_result.stderr | default('') | trim }}
              {{ tui_build_result.stdout | default('') | trim }}
          when: tui_build_result.rc != 0

        - name: Install sparkdock-tui binary
          copy:
            src: "{{ dev_env_dir }}/src/tui/.build/sparkdock-tui"
            dest: "{{ homebrew_brew_bin_path }}/sparkdock-tui"
            mode: "0755"
            remote_src: true

    - name: Configure OpenCode settings
      tags: opencode
      vars:
        opencode_personal_config_notice: >-
          You can create ~/.config/opencode/opencode.json for personal
          customizations. It will be merged with the system-wide configuration
          shipped in /Library/Application Support/opencode/opencode.json.
      block:
        - name: Ensure OpenCode user config directory exists
          file:
            path: "{{ ansible_facts['env']['HOME'] }}/.config/opencode"
            state: directory
            mode: "0755"
          become: no

        - name: Check if user-local opencode config exists
          ansible.builtin.stat:
            path: "{{ ansible_facts['env']['HOME'] }}/.config/opencode/opencode.json"
          register: user_opencode_config

        - name: Compare user-local opencode config with source
          ansible.builtin.command:
            cmd: >-
              diff -q
              "{{ ansible_facts['env']['HOME'] }}/.config/opencode/opencode.json"
              "{{ dev_env_dir }}/config/macos/opencode.json"
          register: opencode_config_diff
          changed_when: false
          failed_when: opencode_config_diff.rc > 1
          when: user_opencode_config.stat.exists

        - name: Remove duplicate user-local opencode config
          ansible.builtin.file:
            path: "{{ ansible_facts['env']['HOME'] }}/.config/opencode/opencode.json"
            state: absent
          when:
            - user_opencode_config.stat.exists
            - opencode_config_diff is defined
            - opencode_config_diff.rc is defined
            - opencode_config_diff.rc == 0

        - name: Notify user about personal opencode configuration
          debug:
            msg: "{{ opencode_personal_config_notice }}"

        - name: Notify with a system notification.
          ansible.builtin.command:
            argv:
              - osascript
              - -e
              - 'display notification "{{ opencode_personal_config_notice }}" with title "OpenCode Configuration"'
          when:
            - not is_non_interactive | default(false)
            - opencode_config_diff is defined
            - opencode_config_diff.rc is defined
            - opencode_config_diff.rc == 0

        - name: Warn user about non-custom opencode config
          ansible.builtin.debug:
            msg: >-
              The file ~/.config/opencode/opencode.json should contain only your
              personal customizations. Any configuration already present in the
              system-wide /Library/Application Support/opencode/opencode.json
              can be safely removed from your local file.
          when:
            - user_opencode_config.stat.exists
            - opencode_config_diff is defined
            - opencode_config_diff.rc is defined
            - opencode_config_diff.rc != 0

        - name: Create system-wide OpenCode config directory
          file:
            path: "/Library/Application Support/opencode"
            state: directory
            mode: "0755"
          become: yes
          become_method: sudo

        - name: Deploy base OpenCode configuration
          copy:
            src: "{{ dev_env_dir }}/config/macos/opencode.json"
            dest: "/Library/Application Support/opencode/opencode.json"
            mode: "0644"
            owner: "{{ ansible_facts['user_id'] }}"
            group: "{{ ansible_facts['user_gid'] }}"
          become: yes
          become_method: sudo

        - name: Display OpenCode configuration status
          debug:
            msg: "✅ OpenCode configuration deployed to /Library/Application Support/opencode/opencode.json (user-writable; OpenCode provider disabled; 172 permission rules: dangerous commands are blocked or require confirmation)"

        - name: Ensure zsh site-functions directory exists
          ansible.builtin.file:
            path: "{{ ansible_facts['env']['HOME'] }}/.local/share/zsh/site-functions"
            state: directory
            mode: "0755"
          become: false

        - name: Generate opencode zsh completions
          ansible.builtin.command: opencode completion
          register: opencode_completion_output
          changed_when: false
          become: false

        - name: Write opencode completions to file
          ansible.builtin.copy:
            content: "{{ opencode_completion_output.stdout }}\n"
            dest: "{{ ansible_facts['env']['HOME'] }}/.local/share/zsh/site-functions/_opencode"
            mode: "0644"
          become: false
          when:
            - opencode_completion_output is not skipped
            - opencode_completion_output.rc == 0

    - name: Configure OpenSpec settings
      tags:
        - openspec
        - ai-harness
        - ai-harness-sync
      block:
        - name: Upgrade OpenSpec CLI to the latest release
          community.general.homebrew:
            name: openspec
            state: latest
            update_homebrew: true
          become: false
          when: "'openspec' in all_homebrew_packages"

        - name: Configure OpenSpec custom profile with all workflows
          command: "{{ dev_env_dir }}/sjust/sjust.sh sf-openspec-configure force"
          become: false

        - name: Ensure zsh site-functions directory exists
          ansible.builtin.file:
            path: "{{ ansible_facts['env']['HOME'] }}/.local/share/zsh/site-functions"
            state: directory
            mode: "0755"
          become: false

        - name: Check if openspec command is available
          shell: command -v openspec >/dev/null 2>&1 && echo "available" || echo "not-available"
          register: openspec_available
          changed_when: false
          become: false

        - name: Generate openspec zsh completions
          ansible.builtin.command: openspec completion generate zsh
          register: openspec_completion_output
          changed_when: false
          become: false
          when: openspec_available.stdout == "available"

        - name: Write openspec completions to file
          ansible.builtin.copy:
            content: "{{ openspec_completion_output.stdout }}\n"
            dest: "{{ ansible_facts['env']['HOME'] }}/.local/share/zsh/site-functions/_openspec"
            mode: "0644"
          become: false
          when:
            - openspec_available.stdout == "available"
            - openspec_completion_output is not skipped
            - openspec_completion_output.rc == 0

        - name: Install or update global OpenSpec skills and prompts for Claude
          ansible.builtin.command: "{{ dev_env_dir }}/sjust/sjust.sh sf-openspec-install-global claude"
          become: false
          when: openspec_available.stdout == "available"
          changed_when: true

    - name: Configure RTK for AI coding tools
      tags:
        - rtk
        - ai-harness
        - ai-harness-sync
      block:
        - name: Run RTK setup script
          command: "{{ dev_env_dir }}/sjust/scripts/rtk/setup.sh"
          changed_when: true
          become: false

    - name: Install caveman output compression for AI coding tools
      tags:
        - caveman
        - ai-harness
        - ai-harness-sync
      block:
        - name: Run caveman setup script
          command: "{{ dev_env_dir }}/sjust/scripts/caveman/setup.sh"
          changed_when: true
          become: false

    - name: Install the herdr agent skill for AI coding tools
      tags:
        - herdr
        - ai-harness
        - ai-harness-sync
      block:
        - name: Run herdr skill setup script
          command: "{{ dev_env_dir }}/sjust/scripts/herdr/setup.sh"
          changed_when: true
          become: false

    - name: Enable gh skill gate for Claude Code
      tags:
        - claude-gh-gate
        - ai-harness
        - ai-harness-sync
      block:
        - name: Register gh skill gate PreToolUse hook
          command: "python3 {{ dev_env_dir }}/sjust/scripts/claude-gh-gate.py enable"
          register: gh_gate_output
          changed_when: "'already enabled' not in gh_gate_output.stdout"
          become: false

    - name: Provision AI coding harness directories and permissions
      tags:
        - skills
        - ai-coding-harness
        - ai-harness
        - ai-harness-provision
      block:
        - name: Ensure agent cache directory exists
          file:
            path: "{{ ansible_facts['env']['HOME'] }}/.cache/sparkdock"
            state: directory
            mode: "0755"
          become: no

        - name: Ensure skills directory exists
          file:
            path: "{{ ansible_facts['env']['HOME'] }}/.agents/skills"
            state: directory
            mode: "0755"
          become: no

        - name: Ensure Copilot agents directory exists
          file:
            path: "{{ ansible_facts['env']['HOME'] }}/.copilot/agents"
            state: directory
            mode: "0755"
          become: no

        - name: Ensure Copilot skills directory exists
          file:
            path: "{{ ansible_facts['env']['HOME'] }}/.copilot/skills"
            state: directory
            mode: "0755"
          become: no

        - name: Ensure Claude Code skills directory exists
          file:
            path: "{{ ansible_facts['env']['HOME'] }}/.claude/skills"
            state: directory
            mode: "0755"
          become: no

        # Codex CLI is optional: ~/.codex is the marker that the user has it, and
        # matches the TOOL_REQUIRES_DIR gate in bin/common/skills-symlink-shim.sh.
        - name: Check whether Codex CLI is present
          stat:
            path: "{{ ansible_facts['env']['HOME'] }}/.codex"
            follow: true
          register: codex_home
          become: no
          changed_when: false

        - name: Ensure Codex skills directory exists
          file:
            path: "{{ ansible_facts['env']['HOME'] }}/.codex/skills"
            state: directory
            mode: "0755"
          become: no
          when: codex_home.stat.exists and codex_home.stat.isdir

        - name: Make sparkdock-agents-sync executable
          file:
            path: "{{ dev_env_dir }}/bin/sparkdock-agents-sync"
            mode: "0755"
          become: yes
          become_method: sudo

        - name: Make sparkdock-agents-status executable
          file:
            path: "{{ dev_env_dir }}/bin/sparkdock-agents-status"
            mode: "0755"
          become: yes
          become_method: sudo

        - name: Make sparkdock-check-updates executable
          file:
            path: "{{ dev_env_dir }}/bin/sparkdock-check-updates"
            mode: "0755"
          become: yes
          become_method: sudo

    - name: Sync AI coding harness resources from upstream repository
      tags:
        - skills
        - ai-coding-harness
        - ai-harness
        - ai-harness-sync
      block:
        - name: Run agent resources sync
          command: "{{ dev_env_dir }}/bin/sparkdock-agents-sync"
          become: no
          register: agents_sync_output
          changed_when: "'added' in agents_sync_output.stdout or 'updated' in agents_sync_output.stdout"
          environment:
            SPARKDOCK_AGENTS_FORCE: "{{ sparkdock_agents_force | default('') }}"

        - name: Show agent resources sync output
          debug:
            msg: "{{ agents_sync_output.stdout_lines }}"
          when: agents_sync_output.stdout_lines | length > 0

  post_tasks:
    - name: Print installation complete message
      debug:
        msg: "macOS system configuration completed successfully!"
