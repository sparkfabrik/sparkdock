name: Test Sparkdock TUI

on:
  push:
    branches: [master, main]
    paths:
      - "src/tui/**"
      - ".github/workflows/test-tui.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "src/tui/**"
      - ".github/workflows/test-tui.yml"
  workflow_dispatch:

jobs:
  test-tui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/tui

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/tui/go.mod
          cache-dependency-path: src/tui/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "These files are not gofmt-formatted:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -count=1 -race
