name: Test Sparkdock Menu Bar App

on:
  push:
    branches: [master, main]
    paths:
      - "src/menubar-app/**"
      - ".github/workflows/test-menubar-app.yml"
      - "ansible/macos/macos/base.yml"
      - "sjust/libs/libshell.sh"
      - "sjust/recipes/00-default.just"
  pull_request:
    branches: [master, main]
    paths:
      - "src/menubar-app/**"
      - ".github/workflows/test-menubar-app.yml"
      - "ansible/macos/macos/base.yml"
      - "sjust/libs/libshell.sh"
      - "sjust/recipes/00-default.just"

jobs:
  test-swift-app:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15, macos-26]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Swift version
        run: swift --version

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test compiler version checks
        working-directory: src/menubar-app
        run: ./test-swift-version.sh

      - name: Check minimum compiler version
        working-directory: src/menubar-app
        run: ./check-swift-version.sh

      - name: Build Swift menubar app
        working-directory: src/menubar-app
        run: |
          echo "Building Sparkdock Menu Bar App..."
          swift build --verbose

      - name: Run Swift tests
        working-directory: src/menubar-app
        run: |
          echo "Running Swift tests..."
          swift test --verbose

      - name: Test Swift app compilation (release)
        working-directory: src/menubar-app
        run: |
          echo "Building release version..."
          make build
          swift build -c release --build-system native

      - name: Verify executable exists
        working-directory: src/menubar-app
        run: |
          echo "Checking if executable was created..."
          find .build -name "sparkdock-manager" -type f -exec file {} \;

      - name: Test executable properties
        working-directory: src/menubar-app
        run: |
          echo "Testing executable properties..."
          EXECUTABLE=$(find .build -name "sparkdock-manager" -type f | head -1)
          if [ -f "$EXECUTABLE" ]; then
            echo "✅ Executable found: $EXECUTABLE"
            ls -la "$EXECUTABLE"
            echo "File type:"
            file "$EXECUTABLE"
            echo "Architecture:"
            lipo -info "$EXECUTABLE" || echo "Single architecture binary"
          else
            echo "❌ Executable not found"
            exit 1
          fi

      - name: Verify the relocated application bundle
        working-directory: src/menubar-app
        run: ./test-bundle.sh

      - name: Make test (if available)
        working-directory: src/menubar-app
        run: |
          if [ -f "Makefile" ]; then
            echo "Running make test..."
            make test || echo "Make test completed with warnings"
          else
            echo "No Makefile found, skipping make test"
          fi

  test-clt-app:
    name: CLT only (${{ matrix.os }}, ${{ matrix.clt }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
        clt: [installed, newest]
    env:
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install the newest offered Command Line Tools
        if: matrix.clt == 'newest'
        shell: bash
        run: |
          set -euo pipefail
          source sjust/libs/libshell.sh
          clt_install_softwareupdate

      - name: Select Command Line Tools only
        run: |
          sudo xcode-select -s /Library/Developer/CommandLineTools
          echo /Library/Developer/CommandLineTools/usr/bin >> "${GITHUB_PATH}"

      - name: Record Apple compiler and SDK versions
        if: always()
        run: |
          set -euo pipefail
          swift --version
          xcode-select -p
          xcrun --sdk macosx --show-sdk-version
          xcrun --sdk macosx --show-sdk-path

      - name: Test compiler version checks
        working-directory: src/menubar-app
        run: ./test-swift-version.sh

      - name: Check minimum compiler version
        working-directory: src/menubar-app
        run: ./check-swift-version.sh

      - name: Test source fingerprints
        working-directory: src/menubar-app
        run: ./test-source-fingerprint.sh

      - name: Build and check the bundle with Command Line Tools only
        working-directory: src/menubar-app
        run: |
          set -euo pipefail
          make build
          swift build -c release --build-system native
          ./test-bundle.sh

      - name: Install and check the bundle through the CLI symlink
        working-directory: src/menubar-app
        run: |
          set -euo pipefail
          app="${HOME}/Applications/Sparkdock Manager.app"
          cli="$(brew --prefix)/bin/sparkdock-manager"
          mkdir -p "${HOME}/Applications"
          ditto ".build/Sparkdock Manager.app" "${app}.new"
          xattr -d com.apple.provenance "${app}.new" 2>/dev/null || true
          xattr -d com.apple.provenance "${app}.new/Contents/MacOS/sparkdock-manager" 2>/dev/null || true
          codesign --force --sign - --identifier com.sparkfabrik.sparkdock.menubar "${app}.new"
          codesign --verify --strict "${app}.new"
          if [[ -e "${app}" ]]; then
            mv "${app}" "${app}.prev"
          fi
          trap 'if [[ -e "${app}.prev" ]]; then if [[ -e "${app}" ]]; then mv "${app}" "${app}.failed"; fi; mv "${app}.prev" "${app}"; fi' ERR
          mv "${app}.new" "${app}"
          ln -sfn "${app}/Contents/MacOS/sparkdock-manager" "${cli}"
          "${cli}" --status
          codesign --verify --strict "${app}"
