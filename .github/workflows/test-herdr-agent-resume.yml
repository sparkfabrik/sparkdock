name: Test herdr agent resume

on:
  push:
    branches: [main, master]
    paths:
      - "sjust/scripts/herdr-agent-resume/**"
      - "sjust/scripts/lib/test_herdr_agent_resume.py"
      - "sjust/scripts/lib/claude_settings.py"
      - ".github/workflows/test-herdr-agent-resume.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "sjust/scripts/herdr-agent-resume/**"
      - "sjust/scripts/lib/test_herdr_agent_resume.py"
      - "sjust/scripts/lib/claude_settings.py"
      - ".github/workflows/test-herdr-agent-resume.yml"
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Run tests (hook, shell paths, management, interactive zsh)
        run: python3 -m unittest -v sjust/scripts/lib/test_herdr_agent_resume.py
