taps:
  - asmvik/formulae
  - charmbracelet/tap
  - anomalyco/tap

# Cloud Tools, Applications, and Fonts
cask_packages:
  - google-cloud-sdk
  - applite
  - font-caskaydia-mono-nerd-font
  - font-droid-sans-mono-nerd-font
  - font-inconsolata-nerd-font
  - font-fira-code-nerd-font
  - font-jetbrains-mono-nerd-font
  - ghostty
  - git-credential-manager
  - iterm2
  - maccy
  - cameracontroller
  - monitorcontrol
  - claude

# Casks installed only if absent, never force-reinstalled (self-updating GUI apps).
# `app` enables detection of installs made outside Homebrew (e.g. downloaded from the web).
cask_install_once_packages:
  - name: docker-desktop
    app: "Docker"
  - name: google-chrome
    app: "Google Chrome"
  - name: visual-studio-code
    app: "Visual Studio Code"
  - name: visual-studio-code@insiders
    app: "Visual Studio Code - Insiders"
  - name: slack
    app: "Slack"
  - name: zoom
    app: "zoom.us"

# Cask packages upgraded to latest on every provisioning run
cask_latest_packages:
  - claude-code@latest
  - copilot-cli

homebrew_packages:
  # Modern bash (5.x). macOS still ships /bin/bash 3.2 because bash 4+ is GPLv3.
  # Several sparkdock scripts use bash-4 idioms (declare -A, mapfile) and rely
  # on Homebrew's bash being first on PATH; making the dependency explicit here.
  - bash
  - coreutils
  # Cloud Tools
  - awscli
  - chafa
  - eza
  - docker-credential-helper-ecr
  - kubernetes-cli
  - k9s
  - kind
  - kubectx
  - skaffold
  - stern
  - lima
  - atuin
  - bat
  - bc
  - charmbracelet/tap/gum
  - btop
  - fastfetch
  - fd
  - gnupg
  - jless
  - just
  - pinentry-mac
  - mactop
  - mergiraf
  - mkcert
  - nss
  - ripgrep
  - thefuck
  - fzf
  - navi
  - jq
  - yq
  - yadm
  - upterm
  - tmux
  - watch
  - zoxide
  - starship
  - openssl@3
  - asmvik/formulae/skhd
  - imagemagick
  - mas
  - gh
  - glab
  - rtk
  - "node"
  - "php@8.2"
  - golang
  - gopls
  - gitleaks
  - pre-commit
  - uv
  - llm
  - anomalyco/tap/opencode
  - openspec
  - playwright-cli
  - python@3.13
  - python@3.14
  - yarn
  - yarn-completion

# NPM Global Packages
npm_packages:
  - intelephense
  - typescript
  - typescript-language-server
  - pyright

linked_packages: []

# Removed packages/taps
removed_homebrew_packages:
  - "node@20"
  - docker-compose
  - "php@8.3"
  - tmate

removed_taps:
  - koekeishiya/formulae
  - homebrew/cask-versions
  - homebrew/cask-fonts
  - homebrew/homebrew-cask-fonts
  - homebrew/cask-drivers

removed_cask_packages: []

# Removed npm packages (uninstalled before brew install to avoid link conflicts)
removed_npm_packages:
  - "@fission-ai/openspec"
